name: Check and publish math notes

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after GitHub Pages is enabled for this private repository
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: math-notes-pages
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check mathematical models and reading links
        run: |
          node checks/math.cjs
          node checks/linear.cjs
          node checks/book.cjs
          node checks/preparatory.cjs
          node checks/coverage.cjs
          node checks/preservation.cjs
          node checks/linear-corrections.cjs
      - name: Assemble site
        run: node scripts/build-site.cjs
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: vars.PAGES_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: check-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
